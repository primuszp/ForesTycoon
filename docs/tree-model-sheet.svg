<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="760" fill="#f2ece0"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#33301f">Fenyő és lombos famodellek — 2D terv</text>
  <text x="40" y="68" font-size="13" fill="#6a6450">Mind azonos léptékben. A szürke rács 1 csempe = 5 egység (ennyi egy út szélessége is). A jobb oldali görbe a lombkorona metszete, amit a renderer megforgat.</text>

  <!-- scale bar -->
  <g>
    <rect x="40" y="92" width="150" height="10" fill="none" stroke="#9a937c" stroke-width="1"/>
    <text x="196" y="102" font-size="12" fill="#6a6450">1 csempe (5 egység) = 150 px · 1 egység = 30 px</text>
  </g>

  <!-- ground line -->
  <line x1="40" y1="600" x2="1140" y2="600" stroke="#b9b195" stroke-width="2"/>

  <!-- ============ SPRUCE ============ -->
  <g>
    <text x="70" y="632" font-size="15" font-weight="700" fill="#33301f">Lucfenyő</text>
    <text x="70" y="652" font-size="12" fill="#6a6450">magasság 6,2 · korona 1,9 széles</text>
    <text x="70" y="670" font-size="12" fill="#6a6450">tiszta törzs a magasság 6 %-a</text>
    <!-- trunk -->
    <rect x="126" y="588" width="9" height="14" fill="#5c4028"/>
    <!-- tiered spire built from whorls, drawn as one silhouette -->
    <path fill="#2b5a48" d="
      M130.5 414
      L 159 447 L 146 447
      L 173 483 L 155 483
      L 186 522 L 163 522
      L 199 560 L 168 560
      L 205 590 L 56 590
      L 62 560 L 92 560
      L 74 522 L 105 522
      L 88 483 L 116 483
      L 102 447 L 115 447 Z"/>
    <!-- sunlit side -->
    <path fill="#3a7259" opacity="0.9" d="
      M130.5 414 L159 447 L146 447 L173 483 L155 483 L186 522 L163 522 L199 560 L168 560 L205 590 L130.5 590 Z"/>
  </g>

  <!-- ============ BEECH ============ -->
  <g>
    <text x="300" y="632" font-size="15" font-weight="700" fill="#33301f">Bükk</text>
    <text x="300" y="652" font-size="12" fill="#6a6450">magasság 5,5 · korona 2,7 széles</text>
    <text x="300" y="670" font-size="12" fill="#6a6450">tiszta törzs a magasság 30 %-a</text>
    <rect x="356" y="510" width="11" height="90" fill="#8a8172"/>
    <path fill="#6f8c3a" d="
      M361 435 C 320 435 300 466 302 495 C 304 523 326 545 361 545
      C 396 545 418 523 420 495 C 422 466 402 435 361 435 Z"/>
    <path fill="#7d9c42" d="
      M361 435 C 320 435 300 466 302 495 C 322 470 340 452 361 447 Z"/>
    <!-- secondary lobes -->
    <circle cx="322" cy="512" r="24" fill="#65813a"/>
    <circle cx="401" cy="509" r="21" fill="#65813a"/>
  </g>

  <!-- ============ OAK ============ -->
  <g>
    <text x="530" y="632" font-size="15" font-weight="700" fill="#33301f">Tölgy</text>
    <text x="530" y="652" font-size="12" fill="#6a6450">magasság 4,6 · korona 4,0 széles</text>
    <text x="530" y="670" font-size="12" fill="#6a6450">tiszta törzs a magasság 26 %-a</text>
    <rect x="632" y="522" width="15" height="78" fill="#6b5236"/>
    <!-- forking limbs -->
    <path stroke="#6b5236" stroke-width="7" fill="none" d="M639 540 L 600 508 M639 545 L 682 512"/>
    <path fill="#4c6a2c" d="
      M639 462 C 575 462 545 486 546 512 C 547 538 578 556 639 556
      C 700 556 731 538 732 512 C 733 486 703 462 639 462 Z"/>
    <path fill="#5a7c33" d="
      M639 462 C 575 462 545 486 546 512 C 572 486 600 471 639 468 Z"/>
    <circle cx="573" cy="524" r="30" fill="#44602a"/>
    <circle cx="706" cy="521" r="27" fill="#44602a"/>
    <circle cx="639" cy="470" r="30" fill="#537530"/>
  </g>

  <!-- ============ BIRCH ============ -->
  <g>
    <text x="810" y="632" font-size="15" font-weight="700" fill="#33301f">Nyír</text>
    <text x="810" y="652" font-size="12" fill="#6a6450">magasság 4,4 · korona 2,2 széles</text>
    <text x="810" y="670" font-size="12" fill="#6a6450">tiszta törzs a magasság 38 %-a</text>
    <rect x="866" y="510" width="7" height="90" fill="#cfcabc"/>
    <path stroke="#cfcabc" stroke-width="4" fill="none" d="M869 520 L 845 498 M869 524 L 893 500"/>
    <path fill="#9cb84e" d="
      M869 468 C 836 468 820 490 822 512 C 824 533 843 546 869 546
      C 895 546 914 533 916 512 C 918 490 902 468 869 468 Z"/>
    <path fill="#adc95a" d="M869 468 C 836 468 820 490 822 512 C 840 490 852 478 869 474 Z"/>
    <circle cx="836" cy="522" r="18" fill="#8fab46"/>
    <circle cx="901" cy="520" r="16" fill="#8fab46"/>
  </g>

  <!-- ============ PROFILES ============ -->
  <g transform="translate(960,110)">
    <text x="0" y="-16" font-size="14" font-weight="700" fill="#33301f">Korona-metszet (forgatott profil)</text>
    <text x="0" y="4" font-size="11" fill="#6a6450">tengely balra · sugár jobbra</text>

    <!-- spruce profile -->
    <g transform="translate(0,24)">
      <line x1="0" y1="0" x2="0" y2="150" stroke="#c3bba2"/>
      <polyline fill="none" stroke="#2b5a48" stroke-width="2.5"
        points="0,150 40,135 26,110 36,93 22,69 28,54 16,32 18,21 0,0"/>
      <text x="52" y="86" font-size="11" fill="#6a6450">tornyos, örvös</text>
    </g>

    <!-- broadleaf profile -->
    <g transform="translate(0,214)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#c3bba2"/>
      <polyline fill="none" stroke="#4c6a2c" stroke-width="2.5"
        points="0,120 34,110 52,92 58,64 54,34 36,12 0,0"/>
      <text x="66" y="66" font-size="11" fill="#6a6450">lapított kupola</text>
    </g>

    <!-- stand strip -->
    <g transform="translate(-20,372)">
      <text x="20" y="0" font-size="14" font-weight="700" fill="#33301f">Záródás egy csempén</text>
      <text x="20" y="18" font-size="11" fill="#6a6450">a koronák átfednek, a talaj eltűnik</text>
      <g transform="translate(20,30)">
        <rect x="0" y="0" width="170" height="60" fill="#7d9a3f" opacity="0.25"/>
        <circle cx="26" cy="34" r="20" fill="#4c6a2c"/><circle cx="58" cy="26" r="23" fill="#537530"/>
        <circle cx="92" cy="35" r="21" fill="#44602a"/><circle cx="126" cy="27" r="24" fill="#537530"/>
        <circle cx="152" cy="37" r="18" fill="#4c6a2c"/>
      </g>
    </g>
  </g>
</svg>
